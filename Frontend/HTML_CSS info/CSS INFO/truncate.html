<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>truncate!</title>

    <style>
        h1 {
            width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid rgb(252, 0, 0);
        }

        h1:hover {
            overflow: visible;
        }

    </style>

</head>

<body>
    <h1> Hello, this is a very very very very very very very very long truncate text example that should definitely
        overflow
    </h1>
</body>

</html>
