<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Model Components</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Edu+NSW+ACT+Cursive:wght@400..700&family=Geist+Mono:ital,wght@0,100..900;1,100..900&family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="main" >
        <h1>Model Components</h1>

        <div class="hero"   id="hero">
            <h1 id="heading">Welcome to the Page..!</h1>
            <button class="ui-btn" id="Signupbtn">
                <span>
                    Sign Up
                </span>
            </button>


            <section id="model-section">
                <form class="form">
                    <p class="form-title">Sign in to your account</p>
                    <div class="input-container">
                        <input type="email" placeholder="Enter email">
                        <span>
                        </span>
                    </div>
                    <div class="input-container">
                        <input type="password" placeholder="Enter password">
                    </div>
                    <button type="submit" class="submit">
                        Sign in
                    </button>

                    <p class="signup-link">
                        No account?
                        <a href="">Sign up</a>
                    </p>
                </form>

            </section>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
